<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KontCe | Tambah Kontrakan</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .form-container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-submit {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <div class="container-navbar">
        <img src="RUMAH.png" class="img-logo" alt="Logo" />
        <h1 class="teks-kontrakan">KontrakanKece</h1>

        <ul class="ul-navbar">
            <li class="li-navbar">
                <a href="kontrakan.html">Beranda</a>
            </li>
            <li class="li-navbar">
                <a href="dafkon.html">Daftar Kontrakan</a>
            </li>
            <li class="li-navbar">
                <a href="dafkot.html">Kota Terdaftar</a>
            </li>
        </ul>
    </div>
    <!-- NAVBAR SELESAI -->

    <!-- FORM PENDAFTARAN -->
    <div class="container-content">
        <div class="form-container">
            <h2 style="text-align: center; margin-bottom: 20px;">Form Pendaftaran Kontrakan</h2>
            
            <form action="/tambah-kontrakan" method="POST">
                <div class="form-group">
                    <label for="nama">Nama Kontrakan</label>
                    <input type="text" id="nama" name="nama" placeholder="Contoh: Kontrakan Impian" required />
                </div>

                <div class="form-group">
                    <label for="kota">Kota</label>
                    <select id="kota" name="kota" required>
                        <option value="">-- Pilih Kota --</option>
                        <option value="jakarta">Jakarta</option>
                        <option value="bogor">Bogor</option>
                        <option value="depok">Depok</option>
                        <option value="tangerang">Tangerang</option>
                        <option value="bekasi">Bekasi</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="harga">Harga per Bulan (Rp)</label>
                    <input type="number" id="harga" name="harga" placeholder="Contoh: 1500000" required />
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat Lengkap</label>
                    <textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat lengkap kontrakan..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="fasilitas">Fasilitas</label>
                    <input type="text" id="fasilitas" name="fasilitas" placeholder="Contoh: AC, WiFi, Kamar Mandi Dalam" required />
                </div>

                <div class="form-group">
                    <label for="kebijakan">Kebijakan / Peraturan</label>
                    <input type="text" id="kebijakan" name="kebijakan" placeholder="Contoh: Dilarang membawa hewan peliharaan" required />
                </div>

                <button type="submit" class="btn-submit">Daftarkan Sekarang</button>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="container-footer">
        <p style="margin: 0; line-height: 1.6; font-size: 15px;">
            © 2026 KontrakanKece. All Rights Reserved.
        </p>
    </footer>
</body>
</html>
